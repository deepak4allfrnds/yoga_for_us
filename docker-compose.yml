# Default = production. Same stack as docker-compose.prod.yml
# Dev:  docker compose -f docker-compose.dev.yml up --build
# Prod: docker compose -f docker-compose.prod.yml up -d --build

name: yoga-prod

services:
  database:
    build: ./database
    image: ${DOCKERHUB_USER:-yourdockerhubuser}/yoga-database:latest
    container_name: yoga_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yoga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yoga123}
      POSTGRES_DB: ${POSTGRES_DB:-yoga_db}
    volumes:
      - yoga_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoga -d yoga_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - yoga-prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-yourdockerhubuser}/yoga-backend:latest
    container_name: yoga_backend
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-yoga}:${POSTGRES_PASSWORD:-yoga123}@database:5432/${POSTGRES_DB:-yoga_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-yoga-secret}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://yogawithmasterankur.com,https://www.yogawithmasterankur.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yoga.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SCHEMA_PATH: /app/schema.sql
    volumes:
      - yoga_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - yoga-prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USER:-yourdockerhubuser}/yoga-frontend:latest
    container_name: yoga_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - yoga-prod
    restart: unless-stopped

volumes:
  yoga_pg_data:
  yoga_uploads:

networks:
  yoga-prod:
    name: yoga_prod_net
