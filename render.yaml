# Render Blueprint — optional one-click deploy from the GitHub repo.
# Dashboard: New → Blueprint → select this repository.
# Manual dashboard steps are in the README / chat guide if you prefer clicking.

databases:
  - name: yoga-db
    plan: free
    databaseName: yoga_db
    user: yoga

services:
  - type: web
    name: yoga-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: yoga-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@yoga.com
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: yoga-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: yoga-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
