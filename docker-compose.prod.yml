# Production — 3 tiers (Nginx + Express + PostgreSQL)
# From repo root:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Website: http://YOUR_SERVER (port 80)
# API:     http://YOUR_SERVER/api  (Nginx proxies to backend:4000)
# Domain:  https://yogawithmasterankur.com (after DNS + SSL)

name: yoga-prod

services:
  database:
    build: ./database
    image: postgres:16-alpine
    container_name: yoga_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yoga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yoga123}
      POSTGRES_DB: ${POSTGRES_DB:-yoga_db}
    ports:
      - "5432:5432"  
    volumes:
      - yoga_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoga -d yoga_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - yoga-prod
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yoga_backend
   
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-yoga}:${POSTGRES_PASSWORD:-yoga123}@database:5432/${POSTGRES_DB:-yoga_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-yoga-secret}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://yogawithmasterankur.com,https://www.yogawithmasterankur.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@yoga.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SCHEMA_PATH: /app/schema.sql
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENV: ${CASHFREE_ENV:-sandbox}
      CASHFREE_TEST_MODE: ${CASHFREE_TEST_MODE:-}
      PAYTM_MID: ${PAYTM_MID:-}
      PAYTM_MERCHANT_KEY: ${PAYTM_MERCHANT_KEY:-}
      PAYTM_WEBSITE: ${PAYTM_WEBSITE:-DEFAULT}
      PAYTM_ENV: ${PAYTM_ENV:-production}
      PAYTM_TEST_MODE: ${PAYTM_TEST_MODE:-}
      PAYMENT_GATEWAYS: ${PAYMENT_GATEWAYS:-paytm,cashfree}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    volumes:
      - yoga_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - yoga-prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yoga_frontend
    ports:
      # Nginx in the frontend image listens on 80
      - "80:80"
    depends_on:
      - backend
    networks:
      - yoga-prod
    restart: unless-stopped

volumes:
  yoga_pg_data:
  yoga_uploads:

networks:
  yoga-prod:
    name: yoga_prod_net
