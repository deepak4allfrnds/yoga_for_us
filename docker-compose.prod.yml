# Production: public HTTP on 80, CORS for the live domain.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  frontend:
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
  backend:
    environment:
      NODE_ENV: production
      CLIENT_ORIGIN: https://yogawithmasterankur.com,https://www.yogawithmasterankur.com
