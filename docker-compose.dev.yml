# Development — 3 tiers with hot reload on the frontend
# From repo root:
#   docker compose -f docker-compose.dev.yml up --build
#
# Website: http://localhost:5173
# API:     http://localhost:4000
# Postgres: localhost:5433 (5432 is often used by other local apps)

name: yoga-dev

services:
  database:
    build: ./database
    container_name: yoga_database_dev
    environment:
      POSTGRES_USER: yoga
      POSTGRES_PASSWORD: yoga123
      POSTGRES_DB: yoga_db
    ports:
      - "5433:5432"
    volumes:
      - yoga_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoga -d yoga_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - yoga-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: yoga_backend_dev
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://yoga:yoga123@database:5432/yoga_db
      JWT_SECRET: change-this-yoga-secret
      CLIENT_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: admin@yoga.com
      ADMIN_PASSWORD: admin123
      SCHEMA_PATH: /app/schema.sql
    volumes:
      - ./backend:/app
      - /app/node_modules
      - yoga_uploads_dev:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - yoga-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: yoga_frontend_dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - yoga-dev

volumes:
  yoga_pg_data_dev:
  yoga_uploads_dev:

networks:
  yoga-dev:
    name: yoga_dev_net
